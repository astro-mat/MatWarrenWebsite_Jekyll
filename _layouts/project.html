<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ page.title }}</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="/css/grid.css">
    <link rel="stylesheet" href="/css/project.css">
    <link rel="stylesheet" href="/css/style.css">

</head>

<body>
    {% include navbar.html %}



    <main class="project-page container-fluid">

        <div class="row">

            <div class="col-lg-4 project-sidebar">
                <h1>{{ page.title }}</h1>

                <h2 class="my-3">{{ page.subtitle }}</h2>

                <h2>{{ page.date | date: "%d.%m.%Y" }}</h2>

                <div class="mt-4">

                    {{ content }}

                </div>


            </div>


            <!-- <div class="col-lg-8 project-images">

                <img src="../images/YATS_Image_1.jpg" alt="Project Image 1">
                <img src="../images/YATS_1.jpg" alt="Project Image 2">
                <img src="../images/YATS_2.jpg" alt="Project Image 3">
                <img src="../images/YATS_3.jpg" alt="Project Image 4">
                <iframe src="https://www.youtube.com/embed/7aS32M5_avM?si=ri27nm_dXiefKaZV" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

            </div> -->

            <div class="col-lg-8 project-images">

                {% for image in page.images %}

                    <img src="{{ image }}" alt="Project Image">

                {% endfor %}

                {% if page.youtube %}

                    <iframe src="{{ page.youtube }}" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                    </iframe>

                {% endif %}

            </div>

        </div>

    </main>




    <footer class="site-footer">

        <hr>

        <div class="container">
            <p>© Mat Warren</p>
        </div>

    </footer>

</body>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/grid.js"></script>

</body>

</html>
