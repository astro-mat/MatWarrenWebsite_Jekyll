<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ page.title }}</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="/css/grid.css">
    <link rel="stylesheet" href="/css/project.css">
    <link rel="stylesheet" href="/css/style.css">

</head>

<body>
    {% include navbar.html %}



    <main class="project-page container-fluid">

        <div class="row">

            <div class="col-lg-4 project-sidebar">
                <h1>{{ page.title }}</h1>

                <h2 class="my-3">{{ page.subtitle }}</h2>

                <h2>{{ page.date | date: "%d.%m.%Y" }}</h2>

                <div class="mt-4">

                    {{ content }}

                </div>


            </div>




            <div class="col-lg-8 project-images">

                {% for image in page.images %}

                    <img src="{{ image }}" alt="Project Image" class="lightbox-image">

                {% endfor %}

                {% if page.youtube %}

                <iframe
                    class="youtube-embed"
                    src="{{ page.youtube }}"
                    allowfullscreen>
                </iframe>

                {% endif %}

                {% if page.bandcamp %}

                <iframe
                    class="bandcamp-embed"
                    src="{{ page.bandcamp }}">
                </iframe>

                {% endif %}

            </div>

        </div>

    </main>

    <div id="lightbox" class="lightbox">

        <button class="lightbox-prev">‹</button>

        <img id="lightbox-img" src="" alt="">

        <button class="lightbox-next">›</button>

        <button class="lightbox-close">×</button>

    </div>




    <footer class="site-footer">

        <hr>

        <div class="container">
            <p>© Mat Warren</p>
        </div>

    </footer>

</body>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/grid.js"></script>
<script src="../js/project.js"></script>

</body>

</html>
