<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ page.title }}</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="{{ '/css/grid.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/css/project.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">

</head>

<body>
    {% include navbar.html %}



    <main class="project-page container-fluid">

        <div class="row">

            <div class="col-lg-4 project-sidebar">
                <h1>{{ page.title }}</h1>

                <h2 class="my-3">{{ page.subtitle }}</h2>

                <h2>{{ page.date | date: "%d.%m.%Y" }}</h2>

                <div class="mt-4">

                    {{ content }}

                </div>


            </div>




        <div class="col-lg-8 project-images">

            <img src="/images/gallery/YATS_Image_1.jpg">

            <div class="image-row">

                <img src="/images/gallery/YATS_1.jpg">

                <img src="/images/gallery/YATS_2.jpg">

            </div>

            <iframe
                src="https://www.youtube.com/embed/7aS32M5_avM"
                allowfullscreen>
            </iframe>

            <img src="/images/gallery/YATS_3.jpg">

        </div>

        </div>

    </main>




    <footer class="site-footer">

        <hr>

        <div class="container">
            <p>© Mat Warren</p>
        </div>

    </footer>

</body>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ '/js/grid.js' | relative_url }}"></script>

</body>

</html>
